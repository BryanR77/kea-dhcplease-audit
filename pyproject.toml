[project]
name = "kea-lease-audit"
dynamic = ["version"]
description = "Verify Kea DHCP HA peers hold identical lease databases"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["PyYAML>=5.1"]

[project.scripts]
kea-lease-audit = "kea_lease_audit.cli:main"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kea_lease_audit"]

# The version comes from the git tag (v1.2.3 -> 1.2.3); untagged builds get a
# dev version like 0.1.dev3+g1234abc. Written to _version.py at build time.
[tool.setuptools_scm]
version_file = "kea_lease_audit/_version.py"
